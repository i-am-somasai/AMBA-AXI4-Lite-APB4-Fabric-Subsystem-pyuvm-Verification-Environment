name: AMBA Fabric CI

on:
  push:
    branches: [ main, 'phase-*', 'remediation-*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-verify:
    name: Lint, Unit, Regression, Formal & Mutation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2026-11-22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Environment Sanity Check
        run: |
          which iverilog verilator yosys sby boolector
          python -c "import cocotb, pyuvm, cocotb_coverage; print('Python EDA packages OK')"

      - name: Check for Synthetic Coverage Calls
        run: ./scripts/check_no_synthetic_cov.sh

      - name: Check Bug References and Docs Consistency
        run: |
          python3 scripts/check_bug_refs.py
          python3 scripts/check_docs_consistency.py

      - name: RTL Lint (Verilator + Policy Gates)
        run: make lint

      - name: L0 Unit Tests
        run: make unit SIM=icarus

      - name: L1 Block Tests
        run: make block SIM=icarus

      - name: L1/L2 Subsystem Regression (3 seeds)
        run: make regress SIM=icarus SEEDS=3

      - name: 16-Mutant Sanity Gate
        run: python3 mutation/sanity/run_sanity.py

      - name: SymbiYosys Formal Verification (10/10 Suites)
        run: make formal

      - name: Sampled Mutation Testing (CI Smoke)
        run: make mutation-sample

      - name: Upload Built CI Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs-and-reports
          path: |
            build/results/
            docs/logs/formal_suite.log
